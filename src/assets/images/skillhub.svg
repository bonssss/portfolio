<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Glowing orbs -->
  <circle cx="300" cy="200" r="300" fill="#06b6d4" opacity="0.12" filter="blur(60px)"/>
  <circle cx="900" cy="400" r="320" fill="#6366f1" opacity="0.14" filter="blur(60px)"/>

  <!-- Grid overlay -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Main Card Mockup -->
  <g filter="url(#shadow)" transform="translate(150, 85)">
    <!-- Browser Window -->
    <rect width="900" height="505" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Top Header -->
    <rect width="900" height="50" rx="16" fill="#1e293b" opacity="0.6"/>
    <circle cx="35" cy="25" r="6" fill="#ef4444"/>
    <circle cx="55" cy="25" r="6" fill="#f59e0b"/>
    <circle cx="75" cy="25" r="6" fill="#10b981"/>
    <rect x="250" y="12" width="400" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="450" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">skillhub.dev/dashboard</text>

    <!-- Header bar inside App -->
    <text x="50" y="105" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">🎯 Developer Learning Roadmap</text>
    <text x="50" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Track your engineering milestones, backend topics &amp; QA mastery</text>

    <!-- Progress Cards -->
    <g transform="translate(50, 155)">
      <!-- Roadmap Card 1: Backend -->
      <rect width="250" height="150" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="25" y="38" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Backend Engineering</text>
      <text x="25" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Node.js, PostgreSQL, APIs</text>
      <rect x="25" y="85" width="200" height="8" rx="4" fill="#1e293b"/>
      <rect x="25" y="85" width="165" height="8" rx="4" fill="url(#blueGlow)"/>
      <text x="25" y="118" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">82% Completed</text>
    </g>

    <g transform="translate(325, 155)">
      <!-- Roadmap Card 2: QA & Automation -->
      <rect width="250" height="150" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="25" y="38" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">QA &amp; Automation</text>
      <text x="25" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Playwright, Jest, CI/CD</text>
      <rect x="25" y="85" width="200" height="8" rx="4" fill="#1e293b"/>
      <rect x="25" y="85" width="180" height="8" rx="4" fill="url(#cyanGlow)"/>
      <text x="25" y="118" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">90% Completed</text>
    </g>

    <g transform="translate(600, 155)">
      <!-- Roadmap Card 3: AI Systems -->
      <rect width="250" height="150" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="25" y="38" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">AI Integration</text>
      <text x="25" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">LLM APIs, LangChain, RAG</text>
      <rect x="25" y="85" width="200" height="8" rx="4" fill="#1e293b"/>
      <rect x="25" y="85" width="130" height="8" rx="4" fill="#8b5cf6"/>
      <text x="25" y="118" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">65% Completed</text>
    </g>

    <!-- Bottom Interactive Milestones -->
    <g transform="translate(50, 335)">
      <rect width="800" height="135" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="30" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Active Learning Milestones</text>

      <!-- Checklist item 1 -->
      <circle cx="45" cy="70" r="10" fill="#10b981"/>
      <text x="45" y="74" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
      <text x="70" y="74" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">Database Optimization &amp; Indexing Strategies</text>
      <text x="720" y="74" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Done</text>

      <!-- Checklist item 2 -->
      <circle cx="45" cy="105" r="10" fill="#3b82f6"/>
      <text x="45" y="109" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">➔</text>
      <text x="70" y="109" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">Automated End-to-End Test Pipelines with GitHub Actions</text>
      <text x="705" y="109" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">In Progress</text>
    </g>
  </g>
</svg>
